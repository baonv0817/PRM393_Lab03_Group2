name: breakbite
description: "BreakBite mobile app: customers (S01–S30) and kiosk sellers (K01–K15)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  barcode: ^2.2.9
  breakbite_core:
    path: ../packages/core
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  firebase_ai: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_svg: ^2.3.2
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  pdf: ^3.13.1
  provider: ^6.1.5+1
  timezone: ^0.11.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # The logo, the sample menu photos and the Nunito font live in packages/core/assets (breakbite_core).
