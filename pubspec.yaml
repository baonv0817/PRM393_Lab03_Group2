name: breakbite
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  barcode: ^2.2.9
  cloud_firestore: ^7.1.0
  connectivity_plus: ^7.3.2
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_svg: ^2.3.2
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  pdf: ^3.13.1
  provider: ^6.1.5+1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Logo BreakBite (SVG; bản PNG và script sinh logo: assets/brand/README.md).
  assets:
    - assets/brand/breakbite_logo.svg
    - assets/brand/breakbite_logo_soft.svg
    # Ảnh món minh hoạ (Unsplash, nguồn ở CREDITS.md); ảnh thật của seller sẽ đến từ Cloud Storage.
    - assets/images/menu/

  # Nunito (SIL OFL, xem assets/fonts/OFL.txt): font biến thiên, một file cho mọi độ đậm.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
